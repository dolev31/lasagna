# Repository settings as code.
#
# Applied by the Probot "Settings" app (https://github.com/apps/settings). If
# that app is not installed, this file is documentation rather than automation —
# the topics below still need setting once by hand, and this is the record of
# what they should be.
#
# Topics matter more than they look: a repository with none does not appear
# under `topic:rag` or `topic:retrieval-augmented-generation`, which is the main
# organic path by which people find a framework on GitHub. Keeping them here
# rather than only in the web UI means they survive a maintainer change.

repository:
  description: >-
    Swap one RAG pipeline stage, hold the rest fixed, and measure whether the
    gain survives composition. The framework behind "Retrieval Augmented
    Generation Compositionality": 450 configurations, eight benchmarks, corpora
    from 5K to 200K documents.
  homepage: https://dolev31.github.io/lasagna/

  topics:
    - rag
    - retrieval-augmented-generation
    - information-retrieval
    - llm
    - evaluation
    - benchmark
    - reranking
    - vector-database
    - hybrid-search
    - semantic-search
    - mcp
    - mcp-server
    - python
    - rag-evaluation
    - ablation-study
    - agentic-rag
    - langgraph
    - beir
    - ragas
    - reproducibility

  has_issues: true
  has_wiki: false
  has_projects: false

  # The gate is the thing that decides whether a change ships; a linear history
  # keeps `git log` readable as a record of why each one did.
  allow_squash_merge: true
  allow_merge_commit: false
  allow_rebase_merge: true
  delete_branch_on_merge: true
