name: Docs

# Builds the documentation site (MkDocs) and publishes it to
# https://dolev31.github.io/lasagna/docs/.
#
# Pages serves the project page from the root of the `site` branch, so the docs
# live in that branch's `docs/` folder. The deploy job replaces that folder and
# touches nothing else in the branch. It commits with GITHUB_TOKEN and never
# force-pushes.
#
# Every pull request that touches the docs, the code the API reference reads, or
# the generators builds with `--strict`, so a broken link or an unresolved
# reference fails before merge. Only a push to main deploys. The tests check that
# the generated pages match the code; this workflow does not install the package.
#
# Actions are pinned by commit SHA, the tag in the trailing comment, as in
# release.yml.

on:
  pull_request:
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "scripts/gen_*.py"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "mkdocs.yml"
      - "src/**"
      - "scripts/gen_*.py"
      - "pyproject.toml"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build the docs
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      # `pip install --group` needs pip 25.1 or later. The docs group pins every
      # tool, so a build here is a build on the maintainer's machine.
      - name: Install the docs group
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group docs

      - name: Build with --strict
        run: mkdocs build --strict --site-dir site

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: docs-site
          path: site
          if-no-files-found: error
          retention-days: 7

  deploy:
    name: Publish to the site branch
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    # One deploy at a time, and a newer push waits instead of cancelling a deploy
    # that is part-way through a commit.
    concurrency:
      group: docs-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: docs-site
          path: built

      # The branch holds the project page at its root. Only docs/ is replaced.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: site
          path: site-branch
          persist-credentials: true

      - name: Replace docs/ and commit
        working-directory: site-branch
        env:
          SOURCE_SHA: ${{ github.sha }}
        run: |
          mkdir -p docs
          rsync -a --delete ../built/ docs/
          git add --all docs
          if git diff --cached --quiet; then
            echo "The docs are unchanged. Nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "docs: publish ${SOURCE_SHA::7}"
          git push origin HEAD:site
