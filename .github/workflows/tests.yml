name: Tests

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
  # The full set once a week, so a lean branch push never hides a version break
  # for long.
  schedule:
    - cron: "17 3 * * 1"

# While the repository is private, Actions minutes are a monthly quota and one
# full run of this workflow bills about 38. A branch push to a
# private repo therefore runs the lean set: lint, both secret scans, the suite on
# Python 3.12 with the coverage floor, and the plugin template, about 12 minutes.
# Pull requests, release tags, the weekly schedule and manual runs get
# everything: the other three Pythons and the E2E gate. Once the repository is
# public, standard runners are free and every push runs everything; no edit is
# needed. `scripts/ci-local.sh` runs the same checks on your machine.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # pytest-socket: a test that opens a connection anywhere but loopback fails.
  # Without it the suite downloaded nltk data and posted ragas telemetry, and
  # passed, because nothing said it should not reach the network.
  NO_NETWORK: --disable-socket --allow-unix-socket --allow-hosts=127.0.0.1,localhost,::1
  # pytest-randomly shuffles test order. -q hides the seed it would print, so
  # pass one: the run id, visible in the command, reproduces the order with
  # `pytest -p randomly --randomly-seed=<run id>`.
  SHUFFLE: --randomly-seed=${{ github.run_id }}

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
      # Pinned to the same version as .pre-commit-config.yaml. Unpinned, uvx
      # takes the newest ruff, whose default rule set and formatter style move
      # between releases: 0.16 enables 413 rules by default against 0.14's 59,
      # which turned a clean tree into thousands of findings with no code change.
      - run: uvx ruff@0.14.7 check .
      - run: uvx ruff@0.14.7 format --check .

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: a credential committed and then deleted is still in the
      # pack, and still recoverable by anyone who clones.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          curl -sSfL \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version

      # Both directions, because they catch different things: `detect` reads
      # every commit, `dir` reads the tree as it stands including files that
      # are untracked but present. .gitleaks.toml allowlists the known
      # placeholders by path and reason, so a finding here is a real finding.
      - name: Scan git history
        run: gitleaks detect --source . --config .gitleaks.toml --redact --verbose

      - name: Scan working tree
        run: gitleaks dir . --config .gitleaks.toml --redact --verbose

  plugin-template:
    name: Plugin template
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6

      # The template is documentation that has to keep working. Installing it
      # for real is the only way to exercise entry-point discovery, which is
      # how every third-party component and benchmark reaches the registry --
      # and which cannot be tested from inside this repo, because entry points
      # come from installed distribution metadata.
      - name: Install Lasagna and the template
        run: |
          uv pip install --system -e . --group dev
          uv pip install --system --no-deps ./examples/lasagna-plugin-template

      - name: The template's own tests
        run: pytest examples/lasagna-plugin-template/tests -q

      - name: Lasagna discovers it
        run: |
          lasagna plugins list
          lasagna component validate lasagna_plugin_template.reranker:LengthReranker

      # A broken plugin must be visible, not silently absent. This asserts the
      # discovery log reports it and that strict mode raises.
      - name: A broken plugin is reported, not swallowed
        run: |
          python - <<'PY'
          from lasagna.core.registry import registry, discovery_log
          registry.list_rerankers()
          names = {e["name"] for e in discovery_log()}
          assert "reranker.template_length" in names, names
          assert all(e["ok"] for e in discovery_log()), discovery_log()
          print("discovery log:", discovery_log())
          PY

  test:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python-version: ${{ fromJSON((github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.private) && '["3.12"]' || '["3.10", "3.11", "3.12", "3.13"]') }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv pip install --system -e ".[eval]" --group dev

      # tests/live needs running services and tests/stress is long-running.
      # Everything else is hermetic, and enforced: sockets are blocked except
      # loopback, the model hub is offline, and tests/conftest.py gives the run
      # a throwaway HOME. Test order is shuffled (pytest-randomly prints the
      # seed in the header), so a test that passes only after another fails
      # here. The few tests that load real embedding weights skip with the hub
      # offline; the next step runs them.
      #
      # Coverage is measured on one version only: the floor is a property of
      # the code, not of the interpreter, and running it four times would just
      # produce four identical numbers.
      - name: Run tests
        if: matrix.python-version != '3.12'
        env:
          HF_HUB_OFFLINE: "1"
        run: pytest tests/ --ignore=tests/live --ignore=tests/stress -q $NO_NETWORK $SHUFFLE

      - name: Run tests with coverage floor
        if: matrix.python-version == '3.12'
        env:
          HF_HUB_OFFLINE: "1"
        run: |
          pytest tests/ --ignore=tests/live --ignore=tests/stress -q $NO_NETWORK $SHUFFLE \
            --cov --cov-report=term-missing:skip-covered

      # The only tests allowed the network: they load the configured embedding
      # model from the Hugging Face Hub.
      - name: Tests that load real embedding weights
        run: pytest tests/ --ignore=tests/live --ignore=tests/stress -q -m needs_embedding_weights

      # Milvus Lite and Qdrant both run in-process, so the vector-backend
      # conformance suite can exercise two real backends with no services.
      # This is how the Qdrant pagination bug was caught; without it the suite
      # would skip itself and prove nothing.
      # Without `vector-backends`, qdrant-client is absent and the Qdrant
      # parameter skips -- so the job named "vector backend conformance"
      # exercised only Milvus while reporting a pass for all of them.
      - name: Install in-process vector backends
        run: uv pip install --system "qdrant-client>=1.7.0"

      - name: Vector backend conformance (in-process backends)
        env:
          LASAGNA_MILVUS_DB_PATH: ${{ runner.temp }}/milvus_conformance.db
          QDRANT_PATH: ${{ runner.temp }}/qdrant_conformance
        run: |
          pytest tests/test_vector_backend_conformance.py tests/test_milvus_reopen_in_new_process.py \
            tests/test_corpus_preflight_is_bounded.py tests/test_profile_guard_reads_a_real_store.py -q

      # The OpenSearch, pgvector and Docling unit tests mock the service but need
      # its client library, which [eval] does not install: without this step
      # 154 of them skipped on every run, and the two backends sat at 9% and 12%
      # coverage. One Python is enough to catch a regression. Online, because
      # the Docling integration tests fetch Docling's layout models.
      - name: Install optional backends and Docling
        if: matrix.python-version == '3.12'
        run: uv pip install --system -e ".[eval,opensearch,pgvector,docling]" --group dev

      - name: OpenSearch, pgvector and Docling unit tests
        if: matrix.python-version == '3.12'
        run: |
          pytest tests/test_opensearch_backend.py tests/test_pgvector_backend.py \
            tests/test_docling_processor.py tests/test_mock_targets_resolve.py -q

  # The rest of the suite runs from inside the repo, with src/ on sys.path.
  # This job is the only thing that checks the package the way a user meets it:
  # built into a wheel, installed into a clean venv, driven from outside.
  # It catches the defects most likely to actually reach someone — a broken
  # install, a broken quickstart, a broken core journey.
  #
  # Phases p8 and p9 need an API key or several minutes, so they stay in
  # the local release gate (see e2e/README.md).
  e2e-smoke:
    name: E2E gate (quick subset)
    runs-on: ubuntu-latest
    # Phase p2 downloads the default models (about 4.5 GB) on a cold cache.
    timeout-minutes: 60
    if: ${{ !(github.event_name == 'push' && github.ref_type == 'branch' && github.event.repository.private) }}
    steps:
      # The gate installs torch twice (here, and again in its own clean venv),
      # which overflows the runner's default free space. Drop toolchains this
      # job never uses.
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL && df -h /

      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6

      - name: Install
        run: uv pip install --system -e ".[eval]" --group dev

      - name: Run release gate
        run: python -m e2e.run --quick

      # Keep the evidence even when the gate fails — that is the run whose
      # metrics are worth reading.
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: e2e/reports/
          if-no-files-found: warn

  compliance:
    name: Secrets and licenses
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6

      # A published package must never ship credentials.
      #
      # `detect-secrets scan --baseline` MERGES findings into the baseline and
      # returns 0 unconditionally -- it rewrites the file rather than checking
      # against it, so this step passed for every commit and could not have
      # failed. `detect-secrets-hook` is the form that exits non-zero.
      #
      # The `secrets` job's gitleaks run is the other half: it covers full
      # history, which a working-tree scan cannot.
      # `--from detect-secrets` is required, not decoration. `uvx <cmd>` resolves
      # the command string as a DISTRIBUTION name, and `detect-secrets-hook` is a
      # console script of the `detect-secrets` distribution -- no distribution of
      # that name exists, so this step errored on every run:
      #
      #   Because detect-secrets-hook was not found in the package registry [...]
      #   your requirements are unsatisfiable
      #
      # It is the first step of this job, so its failure also took the licence
      # check and the internal-reference grep below with it. The whole job was
      # dead. `.pre-commit-config.yaml` already used the correct form.
      #
      # The unowned name is also a supply-chain hazard: anyone could register
      # `detect-secrets-hook` on PyPI and this workflow would install and run it.
      - name: Scan for secrets
        run: |
          git ls-files -z | xargs -0 uvx --from detect-secrets detect-secrets-hook \
            --baseline .secrets.baseline

      # Lasagna is Apache 2.0; copyleft in the dependency graph would make that
      # claim false for anyone installing it.
      #
      # `--partial-match` is load-bearing. Without it pip-licenses does exact
      # case-insensitive equality on the rendered licence name, so a package
      # must report literally "GPL" to trip the gate -- `GPL-3.0-or-later` and
      # `GNU Affero General Public License v3` both sailed through. The gate had
      # never failed and structurally could not, which is how a GPL-3 core
      # dependency (`html2text`, since removed) shipped in every install.
      #
      # Scope note: this installs core only, so the LGPL transitives that live
      # under `[ingest]` are out of the closure. Widening the install here means
      # triaging those first, not loosening the flag.
      #
      # `--python` is the second half of the fix. `uvx` runs pip-licenses in its
      # own ephemeral tool environment, which is created with
      # `include-system-site-packages = false`, and pip-licenses inspects
      # whatever `sys.path` it is running under (defaulting to its own
      # `sys.executable`). So it enumerated the ~3 packages in that throwaway
      # venv -- never the dependency closure installed on the line above -- and
      # returned 0 unconditionally. Two independent reasons this gate could not
      # fail, in the same three lines.
      - name: Check dependency licenses
        run: |
          uv pip install --system -e .
          uvx pip-licenses --python "$(which python)" \
            --partial-match --fail-on="GPL;AGPL;SSPL" \
            --ignore-packages lasagna-rag

      # Guards against an internal endpoint or a developer path being reintroduced.
      #
      # Covers the docs, the README and the e2e harness as well as `src/`:
      # those are the files most likely to carry a pasted local path or a
      # corporate endpoint, because they are written on a developer machine.
      - name: Check for internal references
        run: |
          if grep -rnIE "[a-z0-9-]+\.ibm\.com|/Users/[a-z]+/|/home/[a-z]+/" \
               --include="*.py" --include="*.toml" --include="*.yml" \
               --include="*.yaml" --include="*.md" --include="*.json" \
               src/ tests/ e2e/ docs/ hub/ examples/ README.md CONTRIBUTING.md; then
            echo "::error::Internal or machine-specific reference found"
            exit 1
          fi
