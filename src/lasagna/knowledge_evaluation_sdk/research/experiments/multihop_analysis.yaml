# Does reranking still earn its latency once query expansion is on?
#
#   lasagna benchmark experiment multihop_analysis.yaml
#   lasagna results interaction <output>/results.json --metric ndcg@10
#
# Expansion widens the candidate pool; reranking reorders it. Both raise NDCG on
# their own, and they plausibly fix the same queries: a wider pool is worth
# less if the reranker was already surfacing the right passage. The interesting
# question is not whether each helps, but whether the second still helps once
# the first is on. A 2x2 answers that; two separate arms cannot.
#
# `beir/hotpotqa` is the same questions against a real corpus, so retrieval
# actually happens and NDCG means something.

name: "Multi-hop Reasoning Analysis"
description: "2x2 interaction between query expansion and reranking on multi-hop retrieval"

benchmarks:
  - name: beir/hotpotqa
    n_samples: 300

pipeline:
  base_profile: standard
  factorial:
    # Two independent gates on the live search path: query expansion widens
    # the candidate pool, reranking reorders it. Flags that drive the same
    # mechanism (enable_rag_fusion with enable_query_expansion) are refused as
    # a factorial pair, since three of the four cells would run one search.
    factor_a: enable_query_expansion
    factor_b: enable_reranking
    held_fixed:
      # The classifier can turn enhancement on per query on its own, which
      # would let the `neither` cell expand anyway.
      enable_query_classification: false

mode: live
# Repeat runs when an LLM stage is in the loop: query expansion writes its
# variants with an LLM, so this needs an API key, and runs vary.
n_runs: 3
seed: 42
max_concurrency: 2

output_formats:
  - markdown
  - json
  - latex
