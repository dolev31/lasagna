# BEIR reranker sweep: three rerankers across three BEIR benchmarks.
#
# Usage:  lasagna benchmark experiment beir_sweep.yaml
#
# Runs the `standard` profile on both tracks, so it downloads BGE-M3 and a large
# reranker (3.2 GB), and needs an LLM API key and the eval extra to write and
# judge answers.
#
# A dimension list holds components, not "off": `null` in it leaves the profile
# alone rather than turning a feature off, and swapping the `query_enhancer`
# component does not set `enable_hyde`. A feature is turned on by its flag. To
# ask whether HyDE helps, and whether it still helps once reranking is on, see
# `hyde_x_reranking.yaml`, which is a 2x2 and reports the interaction.

name: "BEIR Reranker Sweep"
description: "Compare reranker variants across BEIR benchmarks"

benchmarks:
  - name: beir/nfcorpus
    n_samples: 200
  - name: beir/scifact
    n_samples: 200
  - name: beir/fiqa
    n_samples: 200

pipeline:
  base_profile: standard
  # An ensemble needs its members named: with one model it would score exactly
  # like cross_encoder, so the harness refuses it.
  config_overrides:
    - {name: cross_encoder, reranker: cross_encoder}
    - {name: combined, reranker: combined}
    - name: ensemble
      reranker: ensemble
      ensemble_reranker_models:
        - mixedbread-ai/mxbai-rerank-large-v1
        - cross-encoder/ms-marco-MiniLM-L-6-v2

mode: live
# Repeat runs when an LLM stage is in the loop: this sweep writes and judges
# answers, and the standard profile can route a query to agentic retrieval.
n_runs: 3
seed: 42
max_concurrency: 4

output_formats:
  - markdown
  - json
  - latex
