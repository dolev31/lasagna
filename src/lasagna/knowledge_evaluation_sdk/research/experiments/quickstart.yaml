# Quickstart — verify the setup works, end to end, in under a minute.
#
# Usage:  lasagna benchmark experiment quickstart.yaml
#
# Uses the `smoke` benchmark: 24 documents and 12 queries held in the package
# itself. No download, no API key, no corpus to fetch. It runs the real live
# pipeline — ingest, embed, retrieve, rerank — so a green run here means the
# stack is genuinely wired up.
#
# It is a smoke test, not a measurement. The corpus is tiny and the queries are
# easy by design, so scores near the top are expected and mean nothing about
# retrieval quality. For that, see beir_sweep.yaml.
#
# This file used to pair beir/nfcorpus with a mode that cannot score retrieval,
# so the config named "quickstart" failed every time it was run.

name: "Quickstart Evaluation"
description: "Hermetic end-to-end check that the pipeline runs and retrieves"

benchmarks:
  - name: smoke

# `auto` resolves to live here, because `smoke` ships a corpus. Leaving it
# unset would do the same; it is spelled out so the intent is visible.
mode: auto
n_runs: 1
seed: 42

output_formats:
  - markdown
  - json
