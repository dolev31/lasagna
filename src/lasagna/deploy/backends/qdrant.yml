# Backend: Qdrant (self-hosted)
#
# Adds a Qdrant container for vector storage.
# Works on both x86 and ARM64.
#
# Usage:
#   docker compose -f docker-compose.yml -f backends/qdrant.yml up -d

# The image needs this store's client library (the `vector-backends` extra);
# the Dockerfile installs it for this build argument.
x-build-args: &build-args
  args:
    VECTOR_BACKEND: qdrant

services:
  qdrant:
    image: qdrant/qdrant:v1.13.2
    # Eight concurrent clients creating collections and payload indexes
    # exhausted the container's default 1024 FDs ("Too many open files")
    # during stress testing; 524288 is validated by that run.
    ulimits:
      nofile:
        soft: 524288
        hard: 524288
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q 200 <&3'"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  api:
    build: *build-args
    environment:
      RAG_VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy

  celery-worker:
    build: *build-args
    environment:
      RAG_VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy

  # Beat only schedules tasks, but it imports the same config, so it gets
  # the same backend settings as every other service.
  celery-beat:
    build: *build-args
    environment:
      RAG_VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333

  mcp:
    build: *build-args
    environment:
      RAG_VECTOR_BACKEND: qdrant
      QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant-data:
