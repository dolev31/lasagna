# Embedded etcd for the Milvus standalone container in milvus.yml. The same
# settings Milvus's own scripts/standalone_embed.sh writes; ETCD_CONFIG_PATH
# points at this file, and Milvus does not start without it.
listen-client-urls: http://0.0.0.0:2379
advertise-client-urls: http://0.0.0.0:2379
quota-backend-bytes: 4294967296
auto-compaction-mode: revision
auto-compaction-retention: '1000'
