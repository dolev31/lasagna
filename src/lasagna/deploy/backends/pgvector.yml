# Backend: PgVector (PostgreSQL + pgvector extension)
#
# Reuses the PostgreSQL metadata database for vector storage.
# No additional vector DB container needed — simplest deployment.
#
# Usage:
#   docker compose -f docker-compose.yml -f backends/pgvector.yml up -d

services:
  postgres:
    image: pgvector/pgvector:pg16
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=128MB

  api:
    environment:
      RAG_VECTOR_BACKEND: pgvector
      PGVECTOR_DSN: postgresql://rag:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rag

  celery-worker:
    environment:
      RAG_VECTOR_BACKEND: pgvector
      PGVECTOR_DSN: postgresql://rag:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rag

  # Beat only schedules tasks, but it imports the same config, so it gets
  # the same backend settings as every other service.
  celery-beat:
    environment:
      RAG_VECTOR_BACKEND: pgvector
      PGVECTOR_DSN: postgresql://rag:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rag

  mcp:
    environment:
      RAG_VECTOR_BACKEND: pgvector
      PGVECTOR_DSN: postgresql://rag:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rag
