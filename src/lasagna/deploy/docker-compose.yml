# ============================================================================
# Lasagna: Base Compose (shared infrastructure)
#
# This is the base file.  Combine with a backend fragment:
#   docker compose -f docker-compose.yml -f backends/pgvector.yml up -d
#
# Or use the Makefile (recommended):
#   VECTOR_BACKEND=pgvector make up
#
# Services defined here:
#   api           FastAPI + Gunicorn (always starts)
#   redis         Cache + message broker (always starts)
#   postgres      Metadata database (always starts)
#   celery-worker Background processing (profile: celery)
#   celery-beat   Periodic GC and orphan scans (profile: celery)
#   mcp           Standalone MCP server (profile: mcp)
#   jaeger        Distributed tracing (profile: tracing)
#
# Every long-running service has a healthcheck, so
#   docker compose -f docker-compose.yml -f backends/qdrant.yml up -d --wait
# returns once the stack can serve, or fails naming the service that cannot.
# ============================================================================

x-env: &common-env
  RAG_DATABASE_BACKEND: postgresql
  # Uses the same POSTGRES_PASSWORD the postgres service requires. Hardcoding
  # a password here would silently override it: the database would be created
  # with the operator's password while the app kept connecting as rag:rag, and
  # the quickest way out of the resulting auth error is to weaken
  # POSTGRES_PASSWORD back to "rag", which is exactly what requiring it prevents.
  RAG_DATABASE_DSN: postgresql://rag:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/rag
  RAG_REDIS_URL: redis://redis:6379
  # The api stores an upload at <upload dir>/<document_id>/<file> and hands
  # that absolute path to the celery worker, which opens it to process the
  # document. Each container has its own filesystem, so the path only resolves
  # on the worker because every service mounts the `uploads-data` volume at
  # this same directory. Metadata and session config live in Postgres, so no
  # SQLite directory needs sharing. The LASAGNA_ name, because it wins over a
  # RAG_UPLOAD_DIR in .env, which would move uploads off the shared volume.
  LASAGNA_UPLOAD_DIR: /data/uploads
  # On shutdown the api waits this long (seconds) for documents still in its
  # own processing threads, then marks them failed with the reason. It has to
  # fit inside gunicorn's --graceful-timeout (30 s in the image), which has to
  # fit inside the api's stop_grace_period below; otherwise the process is
  # killed first and the documents stay "processing". With the celery profile
  # the worker processes documents and these threads are a fallback.
  RAG_PROCESSING_TIMEOUT: "${RAG_PROCESSING_TIMEOUT:-20}"
  RAG_CACHE_BACKEND: redis
  # Session settings (a profile chosen, PATCH /api/v1/config) kept in Postgres,
  # where every gunicorn worker, the celery worker and the mcp server read them.
  # The default keeps them in each process's memory: two requests of one session
  # saw different settings depending on the worker that served them, and the
  # celery worker indexed with settings the session never chose.
  RAG_SESSION_BACKEND: persistent
  # Whether the api queues uploads for celery-worker. `make` derives it from
  # COMPOSE_PROFILES (true with the celery profile) and `make validate` refuses
  # true without it. The api also checks that a worker answers on the broker,
  # and otherwise processes uploads in its own threads and logs why.
  RAG_CELERY_ENABLED: "${RAG_CELERY_ENABLED:-true}"
  RAG_CELERY_BROKER_URL: redis://redis:6379/0
  RAG_CELERY_RESULT_BACKEND: redis://redis:6379/1
  RAG_TENANT_ISOLATION: partition
  RAG_QUOTA_ENABLED: "true"
  RAG_RATE_LIMITING_ENABLED: "true"
  RAG_ENABLE_PROMETHEUS: "true"
  PROMETHEUS_MULTIPROC_DIR: /tmp/prometheus_multiproc
  RAG_ENABLE_TRACING: "${RAG_ENABLE_TRACING:-false}"
  RAG_TRACING_ENDPOINT: "${RAG_TRACING_ENDPOINT:-http://jaeger:4317}"
  # Pool size should be >= gunicorn workers × 2 (default 4 workers → 10)
  RAG_CONNECTION_POOL_SIZE: "${RAG_CONNECTION_POOL_SIZE:-10}"
  RAG_JWT_SECRET: "${RAG_JWT_SECRET:?Set RAG_JWT_SECRET in .env}"
  # Off by default because this file publishes the API on loopback. Turn it on
  # together with API_BIND (see the note on the api service's `ports`). With it
  # on, `X-Session-ID` stops being accepted as identity and callers must present
  # a token from POST /api/v1/sessions.
  RAG_REQUIRE_AUTH: "${RAG_REQUIRE_AUTH:-false}"
  # Guards the GC/admin routes and the five MCP tools that mirror them. Unset
  # means those routes return 503, not that they are open.
  RAG_ADMIN_TOKEN: "${RAG_ADMIN_TOKEN:-}"
  # With RAG_REQUIRE_AUTH on, POST /api/v1/sessions needs one of these in
  # X-API-Key (comma-separated, each at least 32 characters).
  RAG_API_KEYS: "${RAG_API_KEYS:-}"
  # Every service here binds 0.0.0.0 on the container network (it has no other
  # option) and is published on 127.0.0.1 by the `ports:` entries below. The
  # process cannot see the publish address, so it would otherwise refuse to
  # start; this asserts what the ports section already arranges.
  #
  # If you change a published port to 0.0.0.0, set RAG_REQUIRE_AUTH=true with
  # it. This variable says "the network restricts who reaches me", and that
  # stops being true the moment you do.
  RAG_BIND_IS_PROTECTED: "${RAG_BIND_IS_PROTECTED:-true}"
  # Cross-origin browser access is denied unless origins are named here.
  RAG_CORS_ORIGINS: "${RAG_CORS_ORIGINS:-}"
  # With auth off, the api and mcp answer only to localhost, 127.0.0.1, [::1]
  # and the Host names listed here, so a web page cannot reach them by pointing
  # its own domain at this machine (DNS rebinding). The service names let other
  # containers on this network call http://api:8000 and http://mcp:8005. Add the
  # name a reverse proxy forwards, if you put one in front.
  RAG_ALLOWED_HOSTS: "${RAG_ALLOWED_HOSTS:-api:*,mcp:*}"
  # Model and retrieval config
  RAG_EMBEDDING_MODEL: "${RAG_EMBEDDING_MODEL:-BAAI/bge-m3}"
  RAG_EMBEDDING_DIM: "${RAG_EMBEDDING_DIM:-1024}"
  RAG_EMBEDDING_BACKEND: "${RAG_EMBEDDING_BACKEND:-sentence-transformers}"
  RAG_RERANKER_MODEL: "${RAG_RERANKER_MODEL:-mixedbread-ai/mxbai-rerank-large-v1}"
  RAG_ENABLE_CONTEXT_REORDERING: "${RAG_ENABLE_CONTEXT_REORDERING:-true}"
  RAG_ENABLE_RAG_FUSION: "${RAG_ENABLE_RAG_FUSION:-false}"
  RAG_ENABLE_CRAG: "${RAG_ENABLE_CRAG:-false}"
  RAG_ENABLE_CONTEXTUAL_RETRIEVAL: "${RAG_ENABLE_CONTEXTUAL_RETRIEVAL:-false}"
  RAG_DOCLING_ENABLED: "${RAG_DOCLING_ENABLED:-false}"

# The api, worker, beat and mcp containers also read .env itself. Compose uses
# .env only to fill in the ${...} references in this file, so without this an
# OPENAI_API_KEY, PINECONE_API_KEY, QDRANT_API_KEY, RAG_SETTINGS_FILE or any
# other RAG_* override set there never reached the containers. Values under
# `environment:` still win.
x-env-file: &env-file
  - path: .env
    required: false

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "100m"
    max-file: "3"

x-build: &common-build
  # The repository root, three levels up from src/lasagna/deploy: the image
  # copies pyproject.toml, LICENSE, NOTICE, README.md and src/lasagna/ from it.
  context: ../../..
  dockerfile: src/lasagna/deploy/Dockerfile
  args:
    # cpu (the default) or cuda: the torch build the image runs. Set it in .env.
    TORCH_VARIANT: ${TORCH_VARIANT:-cpu}
    # Extras beyond the production set, comma-separated (empty in production;
    # `eval` to run benchmarks and sweeps inside the stack). Set it in .env.
    IMAGE_EXTRAS: ${IMAGE_EXTRAS:-}

services:
  # -------------------------------------------------------------------------
  # API Server (FastAPI + Gunicorn): always starts
  # -------------------------------------------------------------------------
  api:
    build: *common-build
    ports:
      # Loopback by default, like every other service in this file. Docker's
      # port publishing writes its own iptables DNAT rules, so an unqualified
      # "8000:8000" reaches the LAN past most host firewalls, and this is the
      # one service here that can delete documents.
      #
      # To expose it, set API_BIND=0.0.0.0 *and* RAG_REQUIRE_AUTH=true in .env.
      # Nothing inside the container can check that pairing for you: it always
      # sees gunicorn bound to 0.0.0.0 on the container network regardless of
      # how the port is published, so this file is the only place the decision
      # is visible. `lasagna serve` does enforce it, because there the bind
      # address is an argument it can read.
      - "${API_BIND:-127.0.0.1}:${API_PORT:-8000}:8000"
    env_file: *env-file
    environment:
      <<: *common-env
      # Proxy addresses whose X-Forwarded-For gunicorn trusts (the client
      # address the rate limiter and logs see). Unset trusts only loopback.
      FORWARDED_ALLOW_IPS: "${FORWARDED_ALLOW_IPS:-127.0.0.1}"
    volumes:
      - uploads-data:/data/uploads
    # Longer than gunicorn's 30 s graceful timeout; see RAG_PROCESSING_TIMEOUT.
    stop_grace_period: 40s
    # Ready, not merely alive: the backend is loaded and the vector store,
    # Redis and Postgres answer. Loading the embedding model takes a while on
    # a cold start, hence the long start period.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8000/api/v1/health/ready"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Celery Worker: opt in with --profile celery
  # -------------------------------------------------------------------------
  celery-worker:
    build: *common-build
    profiles: ["celery"]
    command: >
      celery
      -A lasagna.infrastructure.tasks.celery_app
      worker
      --loglevel=info
      --concurrency=${CELERY_CONCURRENCY:-4}
    env_file: *env-file
    environment:
      <<: *common-env
      # The worker processes the uploads, so it counts them: Prometheus scrapes
      # celery-worker:9100/metrics for lasagna_ingests_total.
      RAG_WORKER_METRICS_PORT: "9100"
    expose:
      - "9100"
    volumes:
      - uploads-data:/data/uploads
    # The image's own HEALTHCHECK probes the api on :8000, which this
    # container does not serve, so without this the worker reported unhealthy.
    healthcheck:
      # The same -A as the worker command, so the probe reaches this worker
      # through the app's own broker settings. It imports the package, so it
      # runs once a minute rather than every few seconds.
      test: ["CMD-SHELL", "celery -A lasagna.infrastructure.tasks.celery_app inspect ping -d celery@$$HOSTNAME --timeout 10 > /dev/null"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Celery Beat Scheduler: opt in with --profile celery
  # Runs periodic GC and orphan-scan tasks on a cron schedule.
  # Must run alongside celery-worker (one beat instance per cluster).
  # -------------------------------------------------------------------------
  celery-beat:
    build: *common-build
    profiles: ["celery"]
    command: >
      celery
      -A lasagna.infrastructure.tasks.celery_app
      beat
      --loglevel=info
      --scheduler celery.beat.PersistentScheduler
      --schedule /tmp/celerybeat-schedule
    env_file: *env-file
    environment:
      <<: *common-env
    # Beat answers no ping. Its schedule file exists once it has started and
    # loaded the schedule; the process itself is PID 1, so a crash stops the
    # container rather than leaving it running.
    healthcheck:
      test: ["CMD-SHELL", "ls /tmp/celerybeat-schedule* > /dev/null 2>&1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # MCP Server (standalone): opt in with --profile mcp
  # -------------------------------------------------------------------------
  mcp:
    build: *common-build
    profiles: ["mcp"]
    command:
      - python
      - "-m"
      - "lasagna.mcp"
      # stdio is the default transport; a container serves a port.
      - "--transport=sse"
      - "--host=0.0.0.0"
      - "--port=8005"
    ports:
      - "127.0.0.1:${MCP_PORT:-8005}:8005"
    env_file: *env-file
    environment:
      <<: *common-env
      # `safe` (default) leaves out the six tools that delete data or reset
      # configuration; `all` serves them.
      LASAGNA_MCP_TOOLS: "${LASAGNA_MCP_TOOLS:-safe}"
    volumes:
      - uploads-data:/data/uploads
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8005/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 300s
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
    logging: *default-logging
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Redis (Cache + Message Broker): always starts
  # -------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    # Not published: it has no password and is the Celery broker, so any process
    # on the host that reached it could queue a task, the orphan repair with
    # dry_run=False among them. The services reach it on the compose network.
    # To reach it from the host for debugging: -f expose-redis.yml.
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # PostgreSQL (Metadata Database): always starts
  # Image can be overridden by backend fragments (e.g. pgvector/pgvector:pg16)
  # -------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: rag
      POSTGRES_USER: rag
      # Required, like RAG_JWT_SECRET above: fail loudly rather than booting a
      # database with a password published in this file.
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag -d rag"]
      interval: 5s
      timeout: 3s
      retries: 5
    logging: *default-logging
    restart: unless-stopped

  # -------------------------------------------------------------------------
  # Jaeger (Distributed Tracing): opt in with --profile tracing
  # -------------------------------------------------------------------------
  jaeger:
    image: jaegertracing/all-in-one:1.76.0
    profiles: ["tracing"]
    ports:
      - "127.0.0.1:16686:16686"
      - "127.0.0.1:4317:4317"
    logging: *default-logging
    restart: unless-stopped

volumes:
  redis-data:
  postgres-data:
  uploads-data:
