apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: lasagna-config
        namespace: lasagna
      data:
        RAG_VECTOR_BACKEND: "pgvector"
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: lasagna-secrets
        namespace: lasagna
      stringData:
        PGVECTOR_DSN: "postgresql://rag:CHANGE_ME@postgres.lasagna:5432/rag"
