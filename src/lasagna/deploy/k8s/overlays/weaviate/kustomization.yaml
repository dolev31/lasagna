apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: rag-knowledge-config
        namespace: rag-knowledge
      data:
        RAG_VECTOR_BACKEND: "weaviate"
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: rag-knowledge-secrets
        namespace: rag-knowledge
      stringData:
        WEAVIATE_URL: "http://weaviate.rag-knowledge:8080"
        # WEAVIATE_API_KEY: ""  # Set for Weaviate Cloud or authenticated clusters
