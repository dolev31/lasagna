apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: lasagna-config
        namespace: lasagna
      data:
        RAG_VECTOR_BACKEND: "weaviate"
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: lasagna-secrets
        namespace: lasagna
      stringData:
        WEAVIATE_URL: "http://weaviate.lasagna:8080"
        # WEAVIATE_API_KEY: ""  # Set for Weaviate Cloud or authenticated clusters
