# Your secret values, merged over base/secrets.yaml and the overlay's: a key
# not listed here keeps the value it has there. Replace every CHANGE_ME.
# Generate a secret or a key with: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: lasagna-secrets
  namespace: lasagna
stringData:
  RAG_DATABASE_DSN: "postgresql://rag:CHANGE_ME@postgres.lasagna:5432/rag"
  # Signs session tokens; the same value in every replica.
  RAG_JWT_SECRET: "CHANGE_ME"
  # Guards garbage collection, orphan repair and whole-session deletes.
  RAG_ADMIN_TOKEN: "CHANGE_ME"
  # The keys that may mint session tokens, comma-separated, each at least 32
  # characters.
  RAG_API_KEYS: "CHANGE_ME"
  # The store's own credential. pgvector: the same database as above.
  # pinecone: PINECONE_API_KEY. qdrant, weaviate: QDRANT_API_KEY,
  # WEAVIATE_API_KEY when the store requires one.
  PGVECTOR_DSN: "postgresql://rag:CHANGE_ME@postgres.lasagna:5432/rag"
