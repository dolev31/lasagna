apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: rag-knowledge-config
        namespace: rag-knowledge
      data:
        RAG_VECTOR_BACKEND: "milvus"
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: rag-knowledge-secrets
        namespace: rag-knowledge
      stringData:
        RAG_VECTOR_BACKEND_CONFIG: '{"uri": "http://milvus.rag-knowledge:19530"}'
