apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: rag-knowledge-config
        namespace: rag-knowledge
      data:
        RAG_VECTOR_BACKEND: "qdrant"
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: rag-knowledge-secrets
        namespace: rag-knowledge
      stringData:
        QDRANT_URL: "http://qdrant.rag-knowledge:6333"
