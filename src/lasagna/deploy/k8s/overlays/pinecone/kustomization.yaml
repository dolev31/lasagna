apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

patches:
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: lasagna-config
        namespace: lasagna
      data:
        RAG_VECTOR_BACKEND: "pinecone"
        PINECONE_ENVIRONMENT: "us-east-1"
  - patch: |-
      apiVersion: v1
      kind: Secret
      metadata:
        name: lasagna-secrets
        namespace: lasagna
      stringData:
        PINECONE_API_KEY: "CHANGE_ME"
