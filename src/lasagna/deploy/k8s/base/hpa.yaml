apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lasagna-api
  namespace: lasagna
  labels:
    app.kubernetes.io/name: lasagna
    app.kubernetes.io/component: api
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lasagna-api
  minReplicas: 2
  maxReplicas: 10
  # CPU only. A pod's memory is mostly its models, loaded on the first request
  # and held whatever the load, so a memory target says nothing about traffic:
  # the models alone passed 80% of the 2Gi request, and the api stayed at 10.
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: lasagna-celery
  namespace: lasagna
  labels:
    app.kubernetes.io/name: lasagna
    app.kubernetes.io/component: celery-worker
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: lasagna-celery
  minReplicas: 1
  maxReplicas: 8
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
