# The template for the api's and the worker's secrets. Do not edit it: copy
# overlays/local.example to overlays/local/ and set your values there, which
# git, the image and the wheel leave out (deploy/README.md, "Kubernetes").
# In production, prefer a sealed-secrets controller or an external secrets
# operator to plain-text values. The api does not start while RAG_JWT_SECRET
# is CHANGE_ME.
apiVersion: v1
kind: Secret
metadata:
  name: lasagna-secrets
  namespace: lasagna
  labels:
    app.kubernetes.io/name: lasagna
type: Opaque
stringData:
  RAG_DATABASE_DSN: "postgresql://rag:CHANGE_ME@postgres.lasagna:5432/rag"
  RAG_REDIS_URL: "redis://redis.lasagna:6379"
  RAG_CELERY_BROKER_URL: "redis://redis.lasagna:6379/0"
  RAG_CELERY_RESULT_BACKEND: "redis://redis.lasagna:6379/1"
  # Signs session tokens. Must be IDENTICAL across every replica: the secret is
  # per-process when unset, and this Deployment runs two of them behind one
  # Service, so a mismatch shows up as roughly half of all requests returning
  # 401 at random. Generate with: openssl rand -hex 32
  RAG_JWT_SECRET: "CHANGE_ME"

  # Guards the operations whose blast radius is the whole instance rather than
  # one session: POST /gc/run, GET /gc/orphans, POST /gc/repair, GET and PATCH
  # /gc/policy, DELETE /api/v1/sessions/{id}, and the five MCP tools that mirror
  # them. Leaving it unset does not open those routes -- it makes them return
  # 503 permanently, which is why it belongs here rather than being optional.
  # It is NOT a password for the API as a whole; RAG_REQUIRE_AUTH does that.
  RAG_ADMIN_TOKEN: "CHANGE_ME"

  # The ConfigMap sets RAG_REQUIRE_AUTH, so POST /api/v1/sessions issues a token
  # only to a caller presenting one of these in X-API-Key (comma-separated, each
  # at least 32 characters). A placeholder counts as no key: the endpoint then
  # returns 503 rather than issuing tokens to anyone.
  RAG_API_KEYS: "CHANGE_ME"
  # Backend-specific secrets, set per overlay or environment:
  # RAG_VECTOR_BACKEND_CONFIG: '{"uri": "http://milvus.lasagna:19530"}'
  # PGVECTOR_DSN: "postgresql://rag:CHANGE_ME@postgres.lasagna:5432/rag"
  # QDRANT_API_KEY: ""
  # WEAVIATE_API_KEY: ""
  # PINECONE_API_KEY: ""
