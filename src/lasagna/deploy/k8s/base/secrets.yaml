# Sensitive values — in production, use a sealed-secrets controller or
# external secrets operator instead of plain-text manifests.
#
# WARNING: Replace ALL "CHANGE_ME" values before deploying.
# Deploying with placeholder secrets is a critical security risk.
# Generate a JWT secret with: openssl rand -hex 32
apiVersion: v1
kind: Secret
metadata:
  name: rag-knowledge-secrets
  namespace: rag-knowledge
  labels:
    app.kubernetes.io/name: rag-knowledge
type: Opaque
stringData:
  RAG_DATABASE_DSN: "postgresql://rag:CHANGE_ME@postgres.rag-knowledge:5432/rag"
  RAG_REDIS_URL: "redis://redis.rag-knowledge:6379"
  RAG_CELERY_BROKER_URL: "redis://redis.rag-knowledge:6379/0"
  RAG_CELERY_RESULT_BACKEND: "redis://redis.rag-knowledge:6379/1"
  # Signs session tokens. Must be IDENTICAL across every replica: the secret is
  # per-process when unset, and this Deployment runs two of them behind one
  # Service, so a mismatch shows up as roughly half of all requests returning
  # 401 at random. Generate with: openssl rand -hex 32
  RAG_JWT_SECRET: "CHANGE_ME"

  # Guards the operations whose blast radius is the whole instance rather than
  # one session: POST /gc/run, GET /gc/orphans, POST /gc/repair, GET and PATCH
  # /gc/policy, DELETE /api/v1/sessions/{id}, and the five MCP tools that mirror
  # them. Leaving it unset does not open those routes -- it makes them return
  # 503 permanently, which is why it belongs here rather than being optional.
  # It is NOT a password for the API as a whole; RAG_REQUIRE_AUTH does that.
  RAG_ADMIN_TOKEN: "CHANGE_ME"
  # Backend-specific secrets — set per overlay or environment:
  # RAG_VECTOR_BACKEND_CONFIG: '{"uri": "http://milvus.rag-knowledge:19530"}'
  # PGVECTOR_DSN: "postgresql://rag:CHANGE_ME@postgres.rag-knowledge:5432/rag"
  # QDRANT_API_KEY: ""
  # WEAVIATE_API_KEY: ""
  # PINECONE_API_KEY: ""
