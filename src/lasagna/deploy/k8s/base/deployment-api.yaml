apiVersion: apps/v1
kind: Deployment
metadata:
  name: lasagna-api
  namespace: lasagna
  labels:
    app.kubernetes.io/name: lasagna
    app.kubernetes.io/component: api
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lasagna
      app.kubernetes.io/component: api
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lasagna
        app.kubernetes.io/component: api
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      # Longer than gunicorn's --graceful-timeout (30 s in the image), which is
      # longer than RAG_PROCESSING_TIMEOUT (configmap.yaml), so the api finishes
      # or fails its in-flight documents before Kubernetes kills it.
      terminationGracePeriodSeconds: 45
      # The image's rag user (uid and gid 1000) owns the uploads volume.
      securityContext:
        fsGroup: 1000
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: lasagna-uploads
      containers:
        - name: api
          image: lasagna:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
              name: http
              protocol: TCP
          envFrom:
            - configMapRef:
                name: lasagna-config
            - secretRef:
                name: lasagna-secrets
          env:
            # One gunicorn worker per pod; the autoscaler adds pods. Each worker
            # loads the embedding model and the reranker itself, on first use
            # and after the fork (the image's --preload shares the imports, not
            # the models): about 4 GiB with the ConfigMap's models. The image's
            # default of 4 workers needed about 16 GiB against the 6Gi limit.
            - name: WEB_CONCURRENCY
              value: "1"
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          # Sized for one worker with BAAI/bge-large-en-v1.5 and
          # mxbai-rerank-large-v1 (k8s/check_manifests.py, MODEL_GIB). A
          # larger model or more workers needs more: `make validate-k8s`.
          resources:
            requests:
              cpu: "500m"
              memory: "4Gi"
            limits:
              cpu: "2"
              memory: "6Gi"
          # Startup probe: generous timeout for model loading (~60s)
          startupProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            failureThreshold: 30
            periodSeconds: 5
          # Liveness: is the process alive?
          livenessProbe:
            httpGet:
              path: /api/v1/health/live
              port: http
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          # Readiness: can it serve traffic?
          readinessProbe:
            httpGet:
              path: /api/v1/health/ready
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 2
