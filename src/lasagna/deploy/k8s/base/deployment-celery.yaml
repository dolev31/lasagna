apiVersion: apps/v1
kind: Deployment
metadata:
  name: rag-knowledge-celery
  namespace: rag-knowledge
  labels:
    app.kubernetes.io/name: rag-knowledge
    app.kubernetes.io/component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: rag-knowledge
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: rag-knowledge
        app.kubernetes.io/component: celery-worker
    spec:
      terminationGracePeriodSeconds: 120
      # The image's rag user (uid and gid 1000) owns the uploads volume.
      securityContext:
        fsGroup: 1000
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: rag-knowledge-uploads
      containers:
        - name: worker
          image: rag-knowledge:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - lasagna.infrastructure.tasks.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: rag-knowledge-config
            - secretRef:
                name: rag-knowledge-secrets
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          # Workers don't serve HTTP, but a simple exec probe ensures the
          # process hasn't deadlocked.
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - lasagna.infrastructure.tasks.celery_app
                - inspect
                - ping
                - --timeout=5
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
