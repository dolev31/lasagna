apiVersion: apps/v1
kind: Deployment
metadata:
  name: lasagna-celery
  namespace: lasagna
  labels:
    app.kubernetes.io/name: lasagna
    app.kubernetes.io/component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lasagna
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lasagna
        app.kubernetes.io/component: celery-worker
    spec:
      terminationGracePeriodSeconds: 120
      containers:
        - name: worker
          image: lasagna:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - lasagna.infrastructure.tasks.celery_app
            - worker
            - --loglevel=info
            - --concurrency=4
          envFrom:
            - configMapRef:
                name: lasagna-config
            - secretRef:
                name: lasagna-secrets
          resources:
            requests:
              cpu: "1"
              memory: "2Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          # Workers don't serve HTTP, but a simple exec probe ensures the
          # process hasn't deadlocked.
          livenessProbe:
            exec:
              command:
                - celery
                - -A
                - lasagna.infrastructure.tasks.celery_app
                - inspect
                - ping
                - --timeout=5
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 3
