apiVersion: apps/v1
kind: Deployment
metadata:
  name: lasagna-celery
  namespace: lasagna
  labels:
    app.kubernetes.io/name: lasagna
    app.kubernetes.io/component: celery-worker
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: lasagna
      app.kubernetes.io/component: celery-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: lasagna
        app.kubernetes.io/component: celery-worker
    spec:
      terminationGracePeriodSeconds: 120
      # The image's rag user (uid and gid 1000) owns the uploads volume.
      securityContext:
        fsGroup: 1000
      volumes:
        - name: uploads
          persistentVolumeClaim:
            claimName: lasagna-uploads
      containers:
        - name: worker
          image: lasagna:latest
          imagePullPolicy: IfNotPresent
          command:
            - celery
            - -A
            - lasagna.infrastructure.tasks.celery_app
            - worker
            - --loglevel=info
            # Each worker process loads the embedding model itself (about
            # 2.4 GiB with the ConfigMap's model), so the memory below holds two.
            # Without --concurrency Celery forks one per CPU of the node.
            - --concurrency=2
          envFrom:
            - configMapRef:
                name: lasagna-config
            - secretRef:
                name: lasagna-secrets
          volumeMounts:
            - name: uploads
              mountPath: /data/uploads
          resources:
            requests:
              cpu: "1"
              memory: "5Gi"
            limits:
              cpu: "4"
              memory: "8Gi"
          # Asks this pod's worker whether it answers. Started without -n, its
          # node name is celery@<pod hostname>; without -d, a reply from any
          # worker in the cluster passed the probe. Through sh so $HOSTNAME
          # expands. The probe imports the package (about 5 s) before it waits
          # up to 10 s for the reply, hence the timeout, and the period.
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - celery -A lasagna.infrastructure.tasks.celery_app inspect ping -d "celery@$HOSTNAME" --timeout 10 > /dev/null
            periodSeconds: 60
            timeoutSeconds: 20
            failureThreshold: 3
